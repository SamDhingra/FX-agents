# ───────────────────────────────────────────────────────────────────────────
#  FX-Agents configuration
#  mode: sim   → synthetic market + paper broker (no accounts needed)
#        paper → broker's PAPER/practice account (OANDA practice, or IBKR paper port 4002)
#        live  → broker's LIVE account
#  broker: oanda | ibkr   (paper/live only; sim always uses the built-in paper broker)
# ───────────────────────────────────────────────────────────────────────────
mode: sim
broker: oanda                       # env FX_BROKER overrides
timezone: America/New_York          # all session logic runs on NY time (ICT convention)
base_currency: USD
starting_equity: 100000             # only used in sim mode

ibkr:
  host: 127.0.0.1
  port: 4002                        # IB Gateway paper = 4002, live = 4001 (TWS: 7497 / 7496)
  client_id: 17
  account: ""                       # leave blank to use the default account
  market_data_type: 1               # 1 live, 3 delayed (useful if you lack a CME data subscription)

oanda:
  # practice for mode=paper, live for mode=live (paper can never point at live)
  # token + account id come from .env: OANDA_API_TOKEN, OANDA_ACCOUNT_ID (e.g. 001-002-1234567-001)
  position_fill: DEFAULT            # an entry is also refused if it would offset the opposite side
  client_extensions: true           # set false if the account is linked to MT4
  poll_seconds: 5

# Instruments. Add `trade: false` under one to make it watch-only (data, bias, map kept; no new entries).
# Top-level values = IBKR CME micro futures (also used by sim/backtests).
# The `oanda:` block per symbol replaces them when broker = oanda (CFDs, 1 unit = $1 per point,
# gold 1 unit = 1 oz). Tick size, unit step and minimum size are read from the account at start.
instruments:
  XAUUSD:
    contract: {secType: CONTFUT, symbol: MGC, exchange: COMEX}   # alt: {secType: CMDTY, symbol: XAUUSD, exchange: SMART}
    multiplier: 10
    tick_size: 0.1
    commission_per_unit: 0.85
    max_units: 10
    sim_start_price: 3650
    sim_daily_vol: 0.012
    oanda: {instrument: XAU_USD, multiplier: 1, commission_per_unit: 0, max_units: 200}
  NDQ:
    contract: {secType: CONTFUT, symbol: MNQ, exchange: CME}     # alt CFD: {secType: CFD, symbol: IBUST100, exchange: SMART}
    multiplier: 2
    tick_size: 0.25
    commission_per_unit: 0.62
    max_units: 20
    sim_start_price: 24500
    sim_daily_vol: 0.013
    oanda: {instrument: NAS100_USD, multiplier: 1, commission_per_unit: 0, max_units: 30}
  US30:
    contract: {secType: CONTFUT, symbol: MYM, exchange: CBOT}    # alt CFD: {secType: CFD, symbol: IBUS30, exchange: SMART}
    multiplier: 0.5
    tick_size: 1.0
    commission_per_unit: 0.62
    max_units: 20
    sim_start_price: 46500
    sim_daily_vol: 0.009
    oanda: {instrument: US30_USD, multiplier: 1, commission_per_unit: 0, max_units: 20}
  # Forex (USD-quoted, so 1 unit moving 1.0 = $1). Watch-only until the year test says otherwise.
  EURUSD:
    trade: false
    contract: {secType: CASH, symbol: EUR, currency: USD, exchange: IDEALPRO}
    multiplier: 1
    tick_size: 0.00005
    commission_per_unit: 0.00002
    max_units: 500000
    sim_start_price: 1.10
    sim_daily_vol: 0.005
    oanda: {instrument: EUR_USD, multiplier: 1, commission_per_unit: 0, max_units: 1000000}
  GBPUSD:
    trade: false
    contract: {secType: CASH, symbol: GBP, currency: USD, exchange: IDEALPRO}
    multiplier: 1
    tick_size: 0.00005
    commission_per_unit: 0.00002
    max_units: 500000
    sim_start_price: 1.30
    sim_daily_vol: 0.006
    oanda: {instrument: GBP_USD, multiplier: 1, commission_per_unit: 0, max_units: 1000000}
  AUDUSD:
    trade: false
    contract: {secType: CASH, symbol: AUD, currency: USD, exchange: IDEALPRO}
    multiplier: 1
    tick_size: 0.00005
    commission_per_unit: 0.00002
    max_units: 500000
    sim_start_price: 0.66
    sim_daily_vol: 0.006
    oanda: {instrument: AUD_USD, multiplier: 1, commission_per_unit: 0, max_units: 1000000}

timeframes:
  entry: [5min, 15min]    # every strategy runs on both; the 5m and 15m versions compete each hour
  history_days: 12        # 1-minute history pulled at start-up (entries + evaluation)
  h1_history_days: 45     # 1-hour history for Daily / 4H / 1H structure (bias)

# ── Higher-timeframe bias: HARD RULE for every strategy, with safeguards for when it is wrong ──
bias:
  weights: {d: 0.40, h4: 0.35, h1: 0.25}   # composite score in [-1, 1]
  min_align: 0.25          # trade only in the bias direction: side × score ≥ 0.25
  neutral_policy: skip     # skip | reduced   (TFs disagree → no trades, or half size + no pyramiding)
  safeguards:
    suspend_after_losses: 2      # 2 bias-aligned losses in a row on a symbol → bias suspended…
                                 # …until the 1H structure prints a fresh break (either way)
    jev_audit: true              # hourly: Jev judges whether the bias is still valid
    audit_doubt_below: 0.35      #   below this → "in doubt": half size, only A-grade setups
    doubt_min_quality: 0.7
    reversal_exception: true     # counter-bias trade ONLY if: liquidity pool raided (PDH/PDL/Asia)
    reversal_min_jev: 0.7        #   + 1H structure already flipped the trade's way + Jev reversal ≥ 0.7
    reversal_risk_mult: 0.5      #   → half size, 1:1, no pyramiding
    accuracy_horizon_h: 4        # track how often the bias called the next 4 hours correctly

# ── Economic calendar ──
news:
  enabled: true
  feed_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
  refresh_minutes: 60
  currencies: [USD]
  include_medium: true
  tier1_keywords: [FOMC, Federal Funds Rate, Fed Chair, Powell, Non-Farm, CPI, PCE, Advance GDP]
  windows:                  # minutes [before, after] with NO new entries
    tier1: [30, 30]
    high: [15, 15]
    medium: [5, 5]
  pre_news_action:          # what happens to OPEN positions just before the release
    tier1: {minutes: 5, action: protect}   # protect = stop to breakeven+ if in profit, else close
    high: {minutes: 2, action: protect}
  event_day_risk_mult: 0.5  # tier-1 day (FOMC, NFP, CPI, PCE…) → half size all day
  heads_up_minutes: 30      # push notification before each event
  manual_events: []         # e.g. {title: "Powell testimony", date: "2026-10-07T10:00:00-04:00", impact: High, country: USD}

# ── Risk: hard rules enforced by the Risk agent AND again inside the broker layer ──
risk:
  require_stop_loss: true            # an order without a stop is rejected, always
  max_stop_pct_of_trade_value: 0.10  # your rule: stop distance ≤ 10% of trade value
  risk_per_trade_pct: 0.005          # size so a full stop-out costs ≤ 0.5% of equity
  max_open_positions: 3
  max_margin_pct_per_position: 0.25  # margin-funded brokers (OANDA): one position ties up at most 25% of equity
  max_margin_pct_total: 0.60         # …and all positions together at most 60%
  max_positions_per_symbol: 1
  daily_loss_limit_pct: 0.02         # kill switch: flatten + halt for the day at -2%
  max_drawdown_pct: 0.06             # kill switch vs. equity peak
  min_stop_atr: 0.5                  # stops tighter than 0.5 ATR are widened (noise protection)

# ── Sessions (NY time). Entries only inside windows; everything flat before close ──
sessions:
  entry_windows:
    - ["02:00", "05:00"]   # London killzone
    - ["08:30", "11:30"]   # NY AM (incl. 10–11 Silver Bullet)
    - ["13:30", "15:30"]   # NY PM
    - ["20:00", "23:59"]   # Asia (overnight spreads are wider on indices; the 60% gate still applies to them)
  flatten_at: "15:50"      # day trading: all positions closed here
  max_hold_minutes: 240

# ── Trade management: start steady at 1:1, pyramid winners, stops only move toward profit ──
management:
  rr_initial: 1.0              # first target = 1R (the learner may raise per strategy)
  rr_max: 2.5                  # the learner can never push the first target past this
  partial_at_target: 0.5       # bank 50% at the first target
  lock_r: 0.1                  # stop moves to +0.1R (into profit) when the target is hit
  trail_step_r: 1.0            # each further +1R step trails the stop up one step
  trail_gap_r: 0                # >0: after the first target the stop also follows the best price this far behind (R)
  runner:                       # after the first target (tested on ~46k research trades, same entries):
    stall_minutes: 45           #   no new best price for 45 min → stop tightens to best − 0.5R; trades that keep
    stall_gap_r: 0.5            #   making new highs are left alone (0 = off)
    add_mode: structure         #   step = add at each +1R step (incl. right after the partial) · structure = add
                                #   only after a confirmed higher low (lower high) when price makes a new best · both
    structure_trail: false      #   true = stop also follows each confirmed higher low (tested worse: off)
    struct_k: 0                 #   pivot half-width in 1m bars (0 = the entry timeframe in minutes)
  pyramid:
    enabled: true
    max_adds: 0                # adds off (Oct 2026 audit: −0.04R per added trade, fill-price risk bug) — 2 to re-enable
    add_size_frac: 0.5         # each add = 50% of the initial size
    require_continuation: true # Jev must rate continuation likely before adding
    min_continuation_prob: 0.55
    never_risk_open_profit: true   # an add is refused if worst case would turn the trade negative

# ── Jev (TypeSafe) scoring, same pattern as the custom harness ──
jev:
  enabled: true                # falls back to the local heuristic scorer if no TYPESAFE_API_KEY
  model: null                  # null = account default (jev-latest)
  timeout_s: 6
  weight: 0.6                  # blend: weight × Jev + (1 − weight) × quant stats
  min_select_score: 0.55       # below this, the symbol sits out the hour
  min_signal_quality: 0.5      # per-setup gate
  min_signal_confidence: 0.5
  signal_gate: enforce         # enforce: the two gates above block trades | advisory: Jev never blocks, its grade sets size
  advisory_floor: 0.0          # advisory only: block below this quality (0 = never block)
  size_from_quality: [0.3, 0.7]  # advisory only: quality ≤0.3 → half size, ≥0.7 → full size (never above normal risk)

selector:
  mode: hourly_pick            # hourly_pick: this hour's top strategy per TF | setup_first: scan every strategy each bar
                               # | playbook: the research-selected cells (see `playbook:` below)
  top_n_per_tf: 1              # per symbol per hour: best 5m strategy + best 15m strategy
  min_trades_for_stats: 8
  hour_shrinkage_k: 12         # Bayesian shrink of hour-of-day stats toward overall

evaluator:
  lookback_days: 10
  refresh_minutes: 60          # rolling re-evaluation of every strategy version
  optimize_every_hours: 24     # parameter search + new strategy generation
  optimize_at: "17:05"         # NY time, during the CME daily break
  min_trades_promote: 25
  promote_margin_r: 0.05       # candidate must beat incumbent expectancy by this (out-of-sample)
  demote_below_r: -0.05        # live strategies below this expectancy go back to shadow
  max_candidates: 6

# ── Learner (runs inside the Strategist) ──
learner:
  history_days: 90             # walk-forward window for tuning (needs the setup-map history cache; else the bar store)
  is_frac: 0.67                # fit on the first 2/3, validate on the last 1/3 it never saw
  real_block_n: 5              # real trades (paper account + shadow book) that can veto a promotion if negative
  real_demote_n: 15            # real trades that can demote a live version if they lose
  auto_promote: false          # false: the learner only REPORTS what it would promote (Oct 2026 audit: its simulator has no spread)
  live_requires_vetting: true  # LIVE mode: learner-made versions trade only after you vet them (paper promotes automatically)

notifications:
  ntfy_topic: ""               # e.g. "sam-fx-agents-7f3k" → install the ntfy app on your phone
  ntfy_server: https://ntfy.sh
  telegram_bot_token: ""       # or set TELEGRAM_BOT_TOKEN
  telegram_chat_id: ""         # or set TELEGRAM_CHAT_ID
  events: [entry, exit, stop_to_profit, pyramid, kill_switch, agent_down, promotion, daily_summary, news, bias]
  grouping:
    fold_trade_updates: true   # partials / stop moves / adds go into the trade's exit message, not separate pushes
    digest_minutes: 60         # news, bias and strategy updates arrive as one message per hour (0 = send each at once)
    digest_events: [news, bias, promotion]

dashboard:
  host: 0.0.0.0                # reachable over Tailscale from your phone
  port: 8088
  token: ""                    # set DASHBOARD_TOKEN; required for Pause / Flatten buttons

tradingview:
  webhook_secret: ""           # set TV_WEBHOOK_SECRET; alerts post to /webhook/tradingview

sim:
  speed: 0                     # seconds per simulated minute (0 = as fast as possible)
  days: 3                      # simulated trading days after warm-up
  seed: 7

storage:
  db_path: data/journal.sqlite

# ── Setup-first selection (used by whichever book runs it) ──
setup_first:
  max_graded_per_bar: 3          # Jev grades at most this many setups per symbol per bar (best hour-prior first)
  today_context: true            # tell Jev how each setup has done on today's bars so far

# ── Shadow book: runs the OTHER selection mode on the same live bars, virtual fills only ──
shadow:
  enabled: true
  mode: playbook                # what the shadow book runs (default: setup_first if the real book is hourly_pick)
  modes: [playbook]             # shadow books (overrides `mode`); several run side by side, each with its own journal.
                                  # setup_first was dropped in Oct 2026 (−10R over 35 live trades);
                                  # the first keeps db_path / journal_shadow.sqlite, others journal_<mode>.sqlite
  notify_trades: false          # phone alerts for shadow entries/exits (the daily summary always has a shadow line)
  spread:                       # estimated full spread in price points (virtual fills pay half on entry and exit)
    XAUUSD: 0.40
    NDQ: 1.50
    US30: 2.50
    EURUSD: 0.00014
    GBPUSD: 0.00020
    AUDUSD: 0.00016
  # db_path: data/journal_shadow.sqlite   # default: next to the main journal

# ── Playbook strategy (selector.mode or shadow.mode = playbook) ──
# Cells = setup variant × instrument × timeframe × exit profile, chosen weekly from the research grid
# (python run_research.py) over the trailing window. Defaults live in fxagents/playbook.py (Policy);
# anything here overrides them. The research and the validation are on the dashboard's Research page.
playbook:
  tfs: [3min, 5min, 15min, 30min, 1h]   # 1m excluded: the spread is 13–30% of a 1-minute bar
  window_days: 60
  volume: false                 # true = also trade the volume cells (RVOL variants, VWAP); researched either way
  pinned: []                    # cells always traded, whatever the weekly selection picks (still capped per instrument), e.g.
    # - {setup: london_breakout, sym: XAUUSD, tf: 5min, params: {min_body_atr: 0.5}, n: 46, win_rate: 0.50, exp_r: -0.13}
    # (London breakout was pinned on 64 days of data, then unpinned: over a year on gold 5m it lost −0.13R/trade.)
  # instruments:                       # per-instrument overrides, e.g.
  #   XAUUSD: {max_positions: 2, max_cells: 10, min_p: 0.45}
  #   NDQ:    {min_p: 0.60, k_p: 40, min_n: 30}

# ── 90-day setup map: every setup backtested by symbol × hour × weekday (heatmap + setup-first prior) ──
setup_map:
  enabled: true
  days: 90                      # history pulled from OANDA (sim/IBKR use whatever the bar store holds)
  max_age_days: 7               # rebuilt when older than this, and every Sunday evening before the open
