# ───────────────────────────────────────────────────────────────────────────
#  The LIVE (real-money) site — layered on top of config.yaml (+ config.local.yaml) by FX_CONFIG_OVERLAY.
#  Runs as the `fxlive` container with its own data folder (data_live/), its own .env.live (live OANDA key,
#  vault key) and its own address. See docs/live.md. Change this file only on the `live` branch.
# ───────────────────────────────────────────────────────────────────────────
mode: live
broker: oanda
oanda:
  environment: live

live_app:
  enabled: true                 # user accounts + authenticator codes, members, copy engine, live dashboard

selector:
  mode: playbook                # the practice account's book: the playbook's cells …

instruments:                    # … real orders on NDQ only; gold and US30 are watched (prices, bias, charts), never traded
  XAUUSD: {trade: false}
  US30: {trade: false}

playbook:
  frozen: true                  # no automatic re-selection: cells change only when you promote a playbook.json
                                # (./fx.sh live promote-playbook)

risk:
  risk_per_trade_pct: 0.0025    # 0.25% of equity at the stop for a first live week (practice uses 0.5%)
  max_open_positions: 1
  max_positions_per_symbol: 1
  daily_loss_limit_pct: 0.01    # −1% day → flatten and halt until tomorrow
  max_drawdown_pct: 0.05

c10_account:
  enabled: false                # C10 runs as a paper book here (shadow below); set enabled + allow_live to trade it

shadow:
  enabled: true
  modes: [playbook_regime, c10_afternoon]   # paper books shown next to the live account
  notify_trades: false

learner:
  live_requires_vetting: true   # a learner-made strategy version never reaches real money without your vetting

dashboard:
  token: ""                     # not used on the live site (accounts + authenticator codes instead)
